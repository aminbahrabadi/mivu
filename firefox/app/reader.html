<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Mivu — Just read Markdown.</title>
  <link rel="stylesheet" href="./styles.css" />
  <script defer src="./vendor/marked.js"></script>
  <script defer src="./vendor/highlight.min.js"></script>
  <script type="module" src="./reader.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand" aria-label="Mivu Markdown Reader">
      <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><rect width="32" height="32" rx="9" fill="currentColor"/><path d="M7 10h4l5 7 5-7h4v13h-4v-7l-5 7-5-7v7H7Z" fill="var(--brand-contrast)"/></svg>
      <span>mivu<span class="brand-dot">.</span></span>
    </div>
    <div class="docname" id="docname" title="No document selected">No document</div>
    <div class="toolbar">
      <button class="toolbar-btn" type="button" id="open-btn" title="Open Markdown file (Ctrl+O)">Open file</button>
      <button class="toolbar-btn subtle" type="button" id="images-btn" title="Select local images referenced by your Markdown">Add images</button>
      <button class="toolbar-btn icon-only" type="button" id="search-btn" aria-label="Search document" title="Search (Ctrl+F)">⌕</button>
      <label class="visually-hidden" for="theme">Theme</label>
      <select id="theme" aria-label="Color theme" title="Theme">
        <option value="system">System</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </div>
  </header>
  <div class="searchbar" id="searchbar" hidden role="search">
    <label class="visually-hidden" for="search-input">Find in document</label>
    <input id="search-input" type="search" placeholder="Find in document…" autocomplete="off" maxlength="120" />
    <span id="search-count" aria-live="polite">0 matches</span>
    <button id="search-prev" type="button" aria-label="Previous match">↑</button>
    <button id="search-next" type="button" aria-label="Next match">↓</button>
    <button id="search-close" type="button" aria-label="Close search">×</button>
  </div>
  <main id="dropzone">
    <section class="welcome" id="welcome" aria-labelledby="welcome-title">
      <div class="welcome-icon" aria-hidden="true">✦</div>
      <h1 id="welcome-title">Markdown, beautifully simple.</h1>
      <p>Open a local Markdown file or drop it here to start reading.</p>
      <button id="welcome-open" class="primary-btn" type="button">Choose a Markdown file</button>
      <p class="hint">Only files you explicitly select · Works offline · No permissions</p>
    </section>
    <article class="markdown-body" id="document" hidden aria-label="Rendered Markdown"></article>
    <section class="error-message" id="error" hidden role="alert"></section>
  </main>
  <footer class="footer"><span id="status" role="status" aria-live="polite">Ready</span><span id="zoom-status">100%</span></footer>
  <input id="file-input" type="file" accept=".md,.markdown,text/markdown,text/plain" hidden />
  <input id="image-input" type="file" multiple accept=".png,.jpg,.jpeg,.gif,.webp,image/png,image/jpeg,image/gif,image/webp" hidden />
</body>
</html>
